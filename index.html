<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detection System</title>
    
    <!-- Official Supabase JS v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Link to Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AUTHENTICATION CONTAINER -->
    <div id="auth-container" class="container">
        <div class="card">
            <div class="header">
                <span class="badge">FN</span>
                <h2>Fake News Detection</h2>
                <p>Rule-based & AI credibility checker</p>
            </div>

            <!-- Tab Toggle -->
            <div class="tab-buttons">
                <button type="button" id="tab-login" class="active" onclick="switchTab('login')">Log In</button>
                <button type="button" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Auth Form -->
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required>
                </div>

                <p id="auth-error" class="error-message"></p>
                <p id="auth-success" class="success-message"></p>

                <button type="submit" id="auth-btn">Log In</button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD (Hidden until logged in) -->
    <div id="app-container" class="container hidden">
        <div class="card wide">
            <div class="dashboard-header">
                <h2>Article Analysis</h2>
                <button type="button" class="btn-logout" onclick="handleLogout()">Log Out</button>
            </div>

            <form id="analysis-form">
                <div class="form-group">
                    <label for="article-title">Headline / Title</label>
                    <input type="text" id="article-title" placeholder="Enter headline..." required>
                </div>

                <div class="form-group">
                    <label for="article-content">Article Content</label>
                    <textarea id="article-content" rows="6" placeholder="Paste full article text here..." required></textarea>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-secondary" onclick="loadSampleData()">Load Sample</button>
                    <button type="submit" id="analyze-btn" class="btn-primary">Analyze Credibility</button>
                </div>
            </form>

            <!-- Results Output -->
            <div id="result-box" class="result-box hidden">
                <h3>AI Fact Check Analysis</h3>
                <div id="ai-result" class="result-content">Analyzing...</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
